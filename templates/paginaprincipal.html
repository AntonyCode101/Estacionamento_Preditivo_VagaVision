<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VagaVision</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
        }

        #formBusca{
            display:flex;
            gap:10px;
            padding:15px;
            background:#f5f5f5;
            border-bottom:1px solid #ddd;
        }

        #search{
            flex:1;
            padding:10px;
            font-size:16px;
        }

        button{
            padding:10px 20px;
            cursor:pointer;
        }

        #map{
            width:100%;
            height:calc(100vh - 70px);
        }
    </style>
</head>
<body>

<form id="formBusca">
    <input
        type="search"
        id="search"
        placeholder="Digite um endereço..."
        required
    >

    <button type="submit">
        Buscar
    </button>
</form>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    const map = L.map('map').setView(
        [-22.2139, -49.9458],
        14
    );

    L.tileLayer(
        'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 19
        }
    ).addTo(map);

    let marcadorBusca;

    let marcadoresVagas = [];

    function limparVagas(){

        marcadoresVagas.forEach(m => {
            map.removeLayer(m);
        });

        marcadoresVagas = [];
    }

    document
        .getElementById("formBusca")
        .addEventListener("submit", async function(e){

        e.preventDefault();

        const endereco =
            document.getElementById("search").value;

        try{

            const respostaNominatim =
                await fetch(
                    `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(endereco)}`
                );

            const locais =
                await respostaNominatim.json();

            if(locais.length === 0){

                alert("Local não encontrado");

                return;
            }

            const lat =
                parseFloat(locais[0].lat);

            const lon =
                parseFloat(locais[0].lon);

            if(marcadorBusca){

                map.removeLayer(marcadorBusca);
            }

            marcadorBusca =
                L.marker([lat, lon])
                    .addTo(map)
                    .bindPopup(locais[0].display_name)
                    .openPopup();

            map.setView([lat, lon], 17);

            limparVagas();

            const respostaBackend =
                await fetch("/paginaprincipal/buscar",{

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({
                        latitude: lat,
                        longitude: lon
                    })

                });

            const vagas =
                await respostaBackend.json();

            vagas.forEach(vaga => {

                let textoStatus;

                if(vaga.status === "LIVRE"){
                    textoStatus = "🟢 Livre";
                }else{
                    textoStatus = "🔴 Ocupada";
                }

                const marcador =
                    L.marker([
                        vaga.latitude,
                        vaga.longitude
                    ])
                    .addTo(map)
                    .bindPopup(`
                        <b>Vaga #${vaga.id}</b><br>
                        Status previsto: ${textoStatus}<br>
                        Probabilidade livre:
                        ${vaga.probabilidade}%
                    `);

                marcadoresVagas.push(marcador);
            });

        }
        catch(erro){

            console.error(erro);

            alert(
                "Erro ao buscar localização."
            );
        }

    });

</script>

</body>
</html>
